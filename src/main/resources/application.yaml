spring:
  application:
    name: ${APPLICATION_NAME}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    retry:
      max-attempts: 2
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        options:
          model: ${OLLAMA_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  chat:
    memory-window: ${CHAT_MEMORY_WINDOW:20}
