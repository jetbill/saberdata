spring:
  application:
    name: saberdata

  # Conexión a PostgreSQL: valores por defecto de desarrollo (coinciden con compose.yaml).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saberdata}
    username: ${DB_USER:saberdata}
    password: ${DB_PASSWORD:saberdata}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja únicamente Flyway; Hibernate solo valida que coincida.
      ddl-auto: validate

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    retry:
      # Pocos reintentos para que, si Ollama está caído, la API responda 503 rápido.
      max-attempts: 2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}

management:
  endpoints:
    web:
      exposure:
        include: health

# Configuración propia de la aplicación.
# Los secretos NO tienen valor por defecto: deben venir de variables de entorno.
app:
  jwt:
    secret: ${JWT_SECRET:}                          # mínimo 32 caracteres (HS256)
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # separados por coma
  admin:
    # Usuario ADMIN inicial; si ADMIN_PASSWORD está vacío no se crea.
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@saberdata.local}
    password: ${ADMIN_PASSWORD:}
  chat:
    # Cuántos mensajes recientes de la conversación se envían al modelo como contexto.
    memory-window: ${CHAT_MEMORY_WINDOW:20}
