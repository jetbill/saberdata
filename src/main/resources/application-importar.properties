# Perfil "importar": carga el CSV en resultado_saber11 y cierra la aplicación.
#   ./gradlew bootRun --args='--spring.profiles.active=importar'
#   ./gradlew bootRun --args='--spring.profiles.active=importar --app.importar.reemplazar=true'
app.importar.archivo=data/saber11_20224_preparado.csv
app.importar.reemplazar=false

# Puerto libre al azar: no choca con la API si ya está corriendo en PORT.
server.port=0
spring.devtools.restart.enabled=false
# Agrupa los INSERT del lote en uno solo: la carga es mucho más rápida.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
