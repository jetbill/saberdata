# Valores solo para pruebas: los tests no deben depender de las variables de entorno (.env).
# Se combinan con src/main/resources/application.yaml y tienen prioridad sobre él.
# En las pruebas con Testcontainers la conexión real a la base la aporta @ServiceConnection.
server.port=0
spring.application.name=saberdata
spring.datasource.url=jdbc:postgresql://localhost:5432/saberdata
spring.datasource.username=saberdata
spring.datasource.password=saberdata
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
app.jwt.secret=secreto-solo-para-pruebas-con-mas-de-32-caracteres
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
app.admin.username=admin
app.admin.email=admin@saberdata.test
# Vacío: no se crea el ADMIN inicial salvo que el test lo defina.
app.admin.password=
# Los tests no llaman a Cloudflare: el CAPTCHA va desactivado salvo en CaptchaServiceTest.
app.captcha.enabled=false
app.captcha.secret=
app.captcha.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
