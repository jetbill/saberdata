services:
  postgres:
    image: postgres:16
    container_name: saberdata-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-saberdata}
      POSTGRES_USER: ${DB_USER:-saberdata}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saberdata}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - saberdata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saberdata-pgdata:
