plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saberdata'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Carga data/saber11_20224_preparado.csv en resultado_saber11 (perfil "importar") y termina.
//   ./gradlew importarDatos
//   ./gradlew importarDatos -Preemplazar=true   (borra las filas existentes y vuelve a cargar)
// Lee las variables del archivo .env; una variable ya definida en el entorno tiene prioridad.
tasks.register('importarDatos', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Importa el CSV de Saber 11 en la tabla resultado_saber11.'
	mainClass = 'com.saberdata.SaberdataApplication'
	classpath = sourceSets.main.runtimeClasspath
	systemProperty 'spring.profiles.active', 'importar'
	systemProperty 'app.importar.reemplazar', findProperty('reemplazar') ?: 'false'
	doFirst {
		def envFile = file('.env')
		if (!envFile.exists()) {
			throw new GradleException("No existe .env en ${projectDir}. Copia .env.example a .env y ajusta los valores.")
		}
		envFile.eachLine('UTF-8') { linea ->
			def l = linea.trim()
			int i = l.indexOf('=')
			if (l && !l.startsWith('#') && i > 0) {
				def clave = l.substring(0, i).trim()
				def valor = l.substring(i + 1).trim().replaceAll(/^["']|["']$/, '')
				if (System.getenv(clave) == null) {
					environment clave, valor
				}
			}
		}
	}
}
